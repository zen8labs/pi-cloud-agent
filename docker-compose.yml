# Local Postgres and controller.
#
# The sandbox runtime does not run here — it runs on whichever sandbox provider is
# configured, and it reaches the controller at CONTROL_PLANE_URL. For a hosted
# provider that has to be a publicly reachable URL, not localhost.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pi_cloud_agent
      POSTGRES_PASSWORD: pi_cloud_agent
      POSTGRES_DB: pi_cloud_agent
    ports:
      # 5532 rather than 5432, so it does not collide with a local Postgres.
      - "5532:5432"
    volumes:
      - pi_cloud_agent_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pi_cloud_agent -d pi_cloud_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  controller:
    build:
      context: .
      dockerfile: apps/controller/Dockerfile
    env_file: .env
    environment:
      # Reach the compose service rather than whatever .env says for host use.
      DATABASE_URL: postgres://pi_cloud_agent:pi_cloud_agent@db:5432/pi_cloud_agent
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pi_cloud_agent_pg:
