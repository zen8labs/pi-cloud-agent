packages:
  - "apps/*"
  - "packages/*"

# One version of every shared dependency, declared once. Packages reference
# these with "catalog:" so a bump happens in exactly one place.
catalog:
  "@earendil-works/pi-ai": 0.85.1
  "@earendil-works/pi-coding-agent": 0.85.1
  "@hono/node-server": 2.1.1
  "@opentelemetry/api": 1.9.1
  "@opentelemetry/exporter-trace-otlp-proto": 0.222.0
  "@opentelemetry/resources": 2.11.0
  "@opentelemetry/sdk-trace-base": 2.11.0
  # Tracks the engines.node floor, not the newest release: typings for a runtime
  # we do not target describe APIs we cannot call.
  "@types/node": 24.13.4
  drizzle-kit: 0.31.10
  drizzle-orm: 0.45.2
  e2b: 2.49.1
  hono: 4.13.7
  microsandbox: 0.6.18
  postgres: 3.4.9
  tsx: 4.23.13
  typescript: 5.9.3
  zod: 4.6.5

# Refuse to install a version published in the last day. The blast radius of a
# typosquat or a compromised release is usually contained within hours.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

# Install scripts run arbitrary code, so they are opt-in per package. esbuild
# selects a platform binary; the rest are transitive dependencies of the agent
# harness that work fine without theirs.
allowBuilds:
  esbuild: true
  sharp: true
  "@google/genai": false
  protobufjs: false
