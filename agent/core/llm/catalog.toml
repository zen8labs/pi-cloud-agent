# Model catalog — add one [[models]] entry per model you want to expose.
# A model is "available" when every var in required_env is non-empty in the environment.
# No code changes needed: restart the controller after editing this file.

[[models]]
id           = "aigateway/MiniMax/MiniMax-M2.7"
label        = "MiniMax M2.7 (AI Gateway)"
required_env = ["AIGATEWAY_BASE_URL", "AIGATEWAY_API_KEY"]

[[models]]
id           = "openai/gpt-5.4-mini"
label        = "GPT-5.4 mini"
required_env = ["OPENAI_API_KEY"]

