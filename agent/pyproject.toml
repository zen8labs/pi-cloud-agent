[project]
name = "coreview-agent"
version = "0.1.0"
description = "Agentic cloud-agent runtime for CoReview (sandbox + VCS + harness + bundles)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "greenlet>=3.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "e2b>=1.0",
    "litellm>=1.40",
    "python-json-logger>=2.0",
    "tenacity>=8.3",
    "PyJWT>=2.8",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "python-dotenv>=1.0",
    "respx>=0.21",
    "aiosqlite>=0.20",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "bundles*", "runtime*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: opt-in tests that call real external services (E2B, MiniMax gateway)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: long lines tolerated. B008: FastAPI's Depends()/Header() in defaults is
# the intended pattern. UP042: str+Enum is deliberate (JSON-serializable values).
ignore = ["E501", "B008", "UP042"]
