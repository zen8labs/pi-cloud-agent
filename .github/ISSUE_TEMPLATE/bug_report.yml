name: Bug report
description: Something behaves differently than documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a security vulnerability, do not use this form — see
        [SECURITY.md](https://github.com/zen8labs/pi-cloud-agent/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: |
        Commands, the request body, or the webhook that triggered it. A run id
        helps if you have one.
      placeholder: |
        1. pnpm up && pnpm db:migrate
        2. curl -sS -X POST http://localhost:8080/runs -d '{...}'
        3. ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where does it happen
      options:
        - controller (HTTP, reconciler, database)
        - runtime (inside the sandbox)
        - sandbox provider
        - VCS provider / webhooks
        - profile
        - web dashboard
        - build, CI, or local setup
        - not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: |
        Controller logs, run events, or the failing test output.
        **Check for credentials before pasting.**
      render: shell

  - type: input
    id: version
    attributes:
      label: Commit SHA
      placeholder: output of `git rev-parse --short HEAD`
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "macOS 15, Node 22.19.0, pnpm 11.1.3, E2B"

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: "`pnpm verify` output is included above if this is a build or test failure"
        - label: I searched existing issues
          required: true
